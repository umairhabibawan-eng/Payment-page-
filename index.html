<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Payment</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .header {
      background: #007bff;
      color: white;
      padding: 10px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 5px;
    }
    .amount {
      font-size: 24px;
      color: green;
      margin: 15px 0;
      font-weight: bold;
    }
    .qr-box img {
      width: 200px;
      height: 200px;
      margin: 15px 0;
    }
    .btn {
      background: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">Secure Payment</div>
    <p>Step 1: Complete Payment</p>
    <div class="amount">Rs. 1,000</div>
    <div class="qr-box">
      <p>Scan QR Code to Pay</p>
    </div>
    <button class="btn">Confirm Payment</button>
  </div>

</body>
</html>
