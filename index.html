<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Request</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 15px; text-align: center; }
    .timer { color: #d9534f; font-weight: bold; font-size: 18px; margin-bottom: 15px; }
    .card { background: white; border-radius: 8px; padding: 20px; max-width: 400px; margin: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .step-header { font-size: 16px; color: #0066cc; text-align: left; font-weight: bold; margin-top: 15px; margin-bottom: 10px; }
    .field { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #e9ecef; }
    .amount { font-size: 22px; font-weight: bold; color: #000; }
    .btn-copy { background: #007bff; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .qr-box { margin: 15px 0; }
    .qr-box img { width: 220px; height: 220px; border: 1px solid #ddd; padding: 5px; border-radius: 5px; }
    .alert-box { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; text-align: left; font-size: 13px; margin: 10px 0; border: 1px solid #ffeeba; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #cccccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; margin-top: 5px; }
    .btn-submit { width: 100%; background: #28a745; color: white; border: none; padding: 12px; border-radius: 5px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>

<div class="timer">
  Link expires in <span id="time">05:00</span>
</div>

<div class="card">
  <div class="step-header">Step 1 : Copy Payment Details</div>
  
  <div class="field">
    <span>Customer: <br><strong>Bikki kumar</strong></span>
    <button class="btn-copy" onclick="copyText('Bikki kumar')">Copy</button>
  </div>

  <div class="field">
    <span>Amount: <br><span class="amount">₹300</span></span>
    <button class="btn-copy" onclick="copyText('300')">Copy</button>
  </div>

  <div class="field">
    <span>UPI ID: <br><strong>Mrcb26733@nyes</strong></span>
    <button class="btn-copy" onclick="copyText('Mrcb26733@nyes')">Copy</button>
  </div>

  <div class="qr-box">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=upi://pay?pa=Mrcb26733@nyes%26pn=Bikki%20kumar%26am=300%26cu=INR" alt="QR Code">
  </div>

  <div class="step-header">Step 2 : Complete Payment</div>
  <div class="alert-box">
    Do not use old payment details. Complete the transfer immediately.
  </div>

  <div class="step-header">Step 3 : Enter UTR / Reference Number</div>
  <input type="text" placeholder="Enter 12-digit UTR" maxlength="12">
  <button class="btn-submit">Submit UTR</button>
</div>

<script>
  function copyText(text) {
    navigator.clipboard.writeText(text);
    alert('Copied: ' + text);
  }

  function startTimer(duration, display) {
    var timer = duration, minutes, seconds;
    setInterval(function () {
      minutes = parseInt(timer / 60, 10);
      seconds = parseInt(timer % 60, 10);
      minutes = minutes < 10 ? "0" + minutes : minutes;
      seconds = seconds < 10 ? "0" + seconds : seconds;
      display.textContent = minutes + ":" + seconds;
      if (--timer < 0) { timer = 0; }
    }, 1000);
  }
  window.onload = function () {
    var fiveMinutes = 60 * 5, display = document.querySelector('#time');
    startTimer(fiveMinutes, display);
  };
</script>

</body>
</html>
